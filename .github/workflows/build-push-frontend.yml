name: Frontend CI-CD To GKE

on:
  push:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "components/**"
      - "features/**"
      - "shared/**"
      - "providers/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "Dockerfile"
      - ".github/workflows/build-push-frontend.yml"
  workflow_dispatch:

env:
  REGION: ${{ secrets.GCP_REGION }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_WC_PROJECT_ID=${{ vars.NEXT_PUBLIC_WC_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_LKN_ADDRESS=${{ vars.NEXT_PUBLIC_LKN_ADDRESS }} \
            --build-arg NEXT_PUBLIC_REGISTRY_ADDRESS=${{ vars.NEXT_PUBLIC_REGISTRY_ADDRESS }} \
            --build-arg NEXT_PUBLIC_DISTRIBUTOR_ADDRESS=${{ vars.NEXT_PUBLIC_DISTRIBUTOR_ADDRESS }} \
            --build-arg NEXT_PUBLIC_USDC_ADDRESS=${{ vars.NEXT_PUBLIC_USDC_ADDRESS }} \
            --build-arg NEXT_PUBLIC_MARKETPLACE_ADDRESS=${{ vars.NEXT_PUBLIC_MARKETPLACE_ADDRESS }} \
            --build-arg NEXT_PUBLIC_PLATFORM_ADMIN_ADDRESS=${{ vars.NEXT_PUBLIC_PLATFORM_ADMIN_ADDRESS }} \
            --build-arg NEXT_PUBLIC_CHAIN_ID=${{ vars.NEXT_PUBLIC_CHAIN_ID }} \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ env.IMAGE_TAG }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:latest \
            .

      - name: Push images
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: liken-gke
          location: us-central1-a
          project_id: ${{ env.PROJECT_ID }}

      - name: Update frontend deployment image
        run: |
          kubectl -n app set image deployment/frontend frontend=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ env.IMAGE_TAG }}
          # Si el tag no cambió (re-run sobre el mismo commit), set image es un no-op
          # y los pods siguen con la imagen vieja. El restart fuerza el rollout igual.
          kubectl -n app rollout restart deployment/frontend

      - name: Wait for frontend rollout
        run: kubectl -n app rollout status deployment/frontend --timeout=300s
